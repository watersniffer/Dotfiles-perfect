# ~/.config/btop/btop.conf
#
# THEME
# btop's key for this is `color_theme`, NOT `theme` -- an unknown `theme` key is
# silently ignored and btop falls back to its built-in greyscale "Default" theme,
# which is why it never turned gruvbox before. See setTheme() in
# src/btop_theme.cpp: the value is matched against the discovered theme list by
# full path, filename or stem, so "gruvbox_dark.theme" is fine.
color_theme = "catppuccin-mocha.theme"

# Keep the terminal's own background instead of painting btop's bg over it, so
# the gruvbox bg (#1d2021) blends with the kitty background.
theme_background = False

# 250ms is btop's default. This panel is a 1366x768 laptop, so halve the redraw
# rate to keep the CPU cost down.
update_ms = 500

# Don't rewrite this file when btop exits -- it would drop the comments above.
save_config_on_exit = False