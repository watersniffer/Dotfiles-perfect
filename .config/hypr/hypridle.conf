# hypridle -- what happens when the machine is left alone.
#
# Started from the autostart block in hyprland.lua. Started at all for the first
# time here: hypridle was already installed but nothing launched it and the
# compositor config never mentioned it, so the screen never locked on its own.
# Manual locking was swaylock on Super+Alt+L, which is now hyprlock on Super+L.
#
# One listener does both halves of the request:
#
#   timeout = 900      fifteen minutes, counted in seconds by hypridle
#   on-timeout = dpms  turn the panel off. DPMS rather than just blanking the
#                     image, so it is actually the backlight that goes down and
#                     the machine gets to idle properly instead of holding a lit
#                     panel at full power for as long as nobody is there
#   on-resume = hyprlock  any input at all wakes the display, and the same input
#                     puts the lock screen up
#
# The two are one listener on purpose. Split into two, both would start their own
# fifteen-minute timer, and waking the screen would begin a second countdown that
# could lock the session while it was being used.
#
# hyprlock is dismissed with Super+Enter, which is its default. That is set in
# hyprlock.conf rather than here, so the lock screen and this file cannot disagree
# about it.

listener {
    timeout = 900
    on-timeout = dpms
    on-resume = hyprlock
}
