# hyprpaper 0.8.4 needs this file to exist before it will do anything.
#
# It logs "Monitor eDP-1 has no target: no wp will be created" and then silently
# does nothing: this version reads the wallpaper to use from here, not from the
# command line, and with no entry for the output there is no wallpaper at all --
# which is also why 'hyprctl hyprpaper preload' answered "invalid hyprpaper
# request". The runtime switch in WallpaperSelector.qml only works once this has
# seeded a target.
#
# The leading comma on the wallpaper line is required: it is what tells hyprpaper
# this is a single-monitor rule rather than a rule per output.

# preload = $HOME/Pictures/Wallpapers/wall.jpg   (disabled: ~/Pictures/Wallpapers/wall.jpg does not exist)
# wallpaper = eDP-1,$HOME/Pictures/Wallpapers/wall.jpg   (disabled: ~/Pictures/Wallpapers/wall.jpg does not exist)
