# hyprlock -- Style 5 from https://github.com/MrVivekRajan/Hyprlock-Styles
#
# Bound to Super+L, and also what config/hypr/hypridle.conf runs when the screen
# wakes after 15 minutes idle.
#
# WHAT CHANGED FROM UPSTREAM'S Style-5/hyprlock.conf, AND WHY
# ----------------------------------------------------------
# 1. The whole `general {}` block is gone. hyprlock 0.9.6 removed all three keys:
#       config option <general:no_fade_in> does not exist.
#       config option <general:grace> does not exist.
#       config option <general:disable_loading_bar> does not exist.
#    Verified by running the config against a display that does not exist (see
#    below) -- "Proceeding ignoring faulty entries" plus three errors, exit 134.
#    The two keys kept here (hide_cursor, ignore_empty_input) are from the previous
#    grey config and do parse in this version.
#    The missing `grace` still has the consequence noted further down: no delay
#    between the screen waking and input being accepted.
#
# 2. Positions and font sizes are re-laid-out for this panel. Upstream's numbers
#    are for a 1920x1080 screen; this laptop is 1366x768, and upstream as shipped
#    puts the input field at the same offset as the 120px clock (both "0, -140"),
#    so the password box lands on top of the time on any resolution. Every element
#    below is valign=center, which makes `position`'s y the element's centre, and
#    the numbers are the author's own layout (from the README screenshot) scaled by
#    768/1080. On this panel the origin is (683, 384):
#
#       time    font 94, offset -215 -> y=169, glyph ~98px  -> spans 120..218
#       date    font 24, offset -136 -> y=248, glyph ~28px  -> spans 234..262
#       icon    font 92, offset  -36 -> y=348, glyph ~92px  -> spans 302..394
#       hello   font 20, offset   50 -> y=434, glyph ~23px  -> spans 423..445
#       input  270x54, offset  101  -> y=485               -> spans 458..512
#       song    font 13, offset  316 -> y=700, glyph ~15px  -> spans 692..708
#
#    Smallest gap is 16px (clock to date), 60px clear at the bottom, 120px at the
#    top. To move one element, change its one number.
#
# 3. blur_passes is 2, not 3. This is a 2015 laptop (HD 520) and the lock screen
#    has to come up instantly on wake; three blur passes on this GPU is visible
#    lag right when the machine is trying to log in.
#
# 4. `JetBrains Mono Nerd, SF Pro Display Bold` (upstream, song line) is not a
#    font that exists. Pango parses that whole string as ONE family name --
#    family='JetBrains Mono Nerd,SF Pro Display' -- and no such family is
#    installed, so it silently falls back to a default face. The installed family
#    is "JetBrainsMono Nerd Font" (no spaces in "JetBrains"), so the song line
#    now asks for SF Pro Display Bold directly. Any icon inside the song title
#    still draws, because Pango substitutes per character when a glyph is absent.
#
# 5. The icon label is U+F2BE. It is Font Awesome 5's fa-user-circle, and the
#    only reason it renders upstream is Pango's fallback. Here it comes from
#    JetBrainsMono Nerd Font, where the glyph's own name is fa-user_circle_o --
#    checked by reading the font's post table, not fc-list (fc-list lies about
#    this: it reports U+F072 as fa-plane). font_family is set explicitly so the
#    fallback does not have to guess.
#
# 6. Two wording/robustness changes, both easy to revert:
#      * hide_input = true (upstream says false). Upstream also sets dots_size,
#        dots_spacing and dots_center, which only apply when the password is
#        drawn as dots -- with hide_input = false the dots are ignored and the
#        password is echoed in cleartext on screen.
#      * placeholder says "Password", not "Use Me".
#    Upstream's placeholder colour is also malformed: ##ffffff99 is not a valid
#    Pango colour (Pango has no #RRGGBBAA form), so it would draw with no colour
#    set. This is gruvbox fg2 instead, which matches the rest of the desktop.
#
# HOW TO CHECK THIS FILE WITHOUT LOCKING THE SCREEN
# -------------------------------------------------
# Do not just run `hyprlock` to test it. It daemonises, so killing the foreground
# process leaves the real locker holding the session lock -- which is exactly how a
# test locked this desktop earlier. Parse it against a display that does not exist:
#
#   WAYLAND_DISPLAY=definitely-not-a-socket hyprlock -c ~/.config/hypr/hyprlock.conf
#
# It parses the config, prints any errors, and then fails to connect. Exit 134 with
# no "Config has errors" above it means the config is clean; nothing is locked.

# The colours below are upstream's, and they already are gruvbox: rgba(250,189,47)
# is #fabd2f (yellow), rgba(235,219,178) is #ebdbb2 (fg1), and rgba(60,56,54) is
# #3c3836 (bg2). That is why this style suits the rest of the setup unchanged.

# BACKGROUND
# path is the Style-5 wallpaper, already installed at 2880x1620 and byte-identical
# to the repo's copy. contrast/brightness/vibrancy are upstream's washed look.
background {
    monitor =
    path = ~/.config/hypr/hyprlock.png
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# The only two general keys 0.9.6 still has. hide_cursor keeps a stray mouse
# pointer off the lock screen; ignore_empty_input skips an empty submit.
general {
    hide_cursor = true
    ignore_empty_input = true
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%-I:%M%p")"
    color = rgba(249, 226, 175, .75)
    font_size = 94
    font_family = SF Pro Display Bold
    position = 0, -215
    halign = center
    valign = center
}

# DAY-DATE-MONTH
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date '+%A, %d %B')</span>"
    color = rgba(166, 173, 200, 0.75)
    font_size = 24
    font_family = SF Pro Display Bold
    position = 0, -136
    halign = center
    valign = center
}

# USER-CIRCLE ICON (U+F2BE, fa-user-circle in JetBrainsMono Nerd Font)
label {
    monitor =
    text = 
    color = rgba(245, 224, 220, 0.65)
    font_size = 92
    font_family = JetBrainsMono Nerd Font
    position = 0, -36
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text = Hello, $USER
    color = rgba(205, 214, 244, .65)
    font_size = 20
    font_family = SF Pro Display Bold
    position = 0, 50
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 270, 54
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(49, 50, 68, 0.35)
    font_color = rgba(205, 214, 244, 1)
    fade_on_empty = false
    font_family = SF Pro Display Bold
    placeholder_text = <i><span foreground="#a6adc8">Password</span></i>
    hide_input = true
    rounding = 27 # half the 54px height, which is the pill in the README shot
    position = 0, 101
    halign = center
    valign = center
}

# CURRENT SONG
# songdetail.sh only reads playerctl metadata, so this displays what Spotify is
# playing and changes nothing about it. Empty when nothing is playing.
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/Scripts/songdetail.sh)"
    color = rgba(186, 194, 222, .75)
    font_size = 13
    font_family = SF Pro Display Bold
    position = 0, 316
    halign = center
    valign = center
}
