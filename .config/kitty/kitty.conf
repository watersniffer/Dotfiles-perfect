confirm_os_window_close 0
font_size 10
font_family JetBrainsMono Nerd Font Mono


background_opacity                  0.7

text_composition_strategy            1.0 30


cursor_shape               block
cursor_trail                1

window_padding_width        0

include current-theme.conf


bell                 none
shell /usr/bin/zsh

# Remote control, so `theme-switcher` can recolour terminals that are already
# open instead of only new ones. At the end of every switch it runs
#
#   kitty @ --to unix:@kitty-$USER set-colors --configured --all
#
# which re-reads current-theme.conf into every window.
#
# The listening socket is an *abstract* unix socket (`unix:@...`), so it has no
# file on disk and cannot be pre-created or symlinked by another user on /tmp.
#
# Note the asymmetry, which is not a typo: kitty 0.49.2 honours --listen-on as a
# command line flag only. `listen_on` is a recognised config key (it is not
# reported as unknown) but it has no effect from a config file -- verified
# against this build with the abstract form, a /tmp path, and the prefixless
# form, all three of which create no socket. That is why the listener is set by
# ~/.local/bin/kitty, a wrapper that adds the flag and execs /usr/bin/kitty.
allow_remote_control  yes
